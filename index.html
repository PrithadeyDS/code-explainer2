      width: min(100%, 950px);

    .header {

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 7vw, 5rem);

      margin-bottom: 8px;

      padding: 28px;

      box-shadow:

      margin-bottom: 20px;
    }

      display: block;

<body>

  <div class="container">

    <!-- HEADER -->

    <header class="header">

      <h1>CodeLens</h1>

      <p class="subtitle">
        Understand your code. Improve it. Optimize it.
      </p>

    </header>


    <!-- CODE INPUT -->

    <main>

      <div class="card">

        <label for="code">
          Your code
        </label>

        <textarea
          id="code"
          placeholder="Paste your code here..."
        ></textarea>


        <div class="controls">

          <div class="language-box">

            <label for="language">
              Language
            </label>

            <select id="language">

              <option>Python</option>
              <option>C++</option>
              <option>Java</option>
              <option>JavaScript</option>

            </select>

          </div>


          <div class="actions">

            <button id="btnExplain">
              Explain Code
            </button>

            <button id="btnImprove">
              Improve Code
            </button>

            <button id="btnOptimize">
              Optimize Code
            </button>

          </div>

        </div>

      </div>


      <!-- STATUS / ERRORS -->

      <div id="status"></div>

      <div id="error"></div>


      <!-- AI OUTPUT -->

      <div id="output"></div>

    </main>


    <footer class="footer">
      CodeLens
    </footer>

  </div>



  <script>

    const codeEl =
      document.getElementById('code');

    const langEl =
      document.getElementById('language');

    const statusEl =
      document.getElementById('status');

    const errorEl =
      document.getElementById('error');

    const outputEl =
      document.getElementById('output');


    const buttons = [

      document.getElementById('btnExplain'),

      document.getElementById('btnImprove'),

      document.getElementById('btnOptimize')

    ];


    async function run(action) {

      const code = codeEl.value.trim();

      errorEl.textContent = '';

      outputEl.innerHTML = '';


      if (!code) {

        errorEl.textContent =
          'Please paste some code first.';

        return;

      }


      buttons.forEach(button => {

        button.disabled = true;

      });


      statusEl.textContent =
        'Analyzing your code...';


      try {

        const res =
          await fetch('/api/explain', {

            method: 'POST',

            headers: {

              'Content-Type':
                'application/json'

            },

            body: JSON.stringify({

              code: code,

              language: langEl.value,

              action: action

            })

          });


        const data =
          await res.json();


        statusEl.textContent = '';


        if (!res.ok) {

          errorEl.textContent =
            data.error ||
            'Something went wrong.';

          return;

        }


        render(
          action,
          data.result
        );


      } catch (error) {

        statusEl.textContent = '';

        errorEl.textContent =
          'Network error: ' +
          error.message;


      } finally {

        buttons.forEach(button => {

          button.disabled = false;

        });

      }

    }



    function render(action, result) {

      if (result.raw) {

        outputEl.innerHTML = `

          <div class="card">

            <h3>Result</h3>

            <pre>${escapeHtml(result.raw)}</pre>

          </div>

        `;

        return;

      }



      /* EXPLAIN */

      if (action === 'explain') {

        outputEl.innerHTML = `

          <div class="card">

            <h3>What it does</h3>

            <p>
              ${escapeHtml(
                result.what_it_does || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>How it works</h3>

            <p>
              ${escapeHtml(
                result.how_it_works || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>Time complexity</h3>

            <p>
              ${escapeHtml(
                result.time_complexity || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>Space complexity</h3>

            <p>
              ${escapeHtml(
                result.space_complexity || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>
              Key functions and variables
            </h3>

            <ul>

              ${
                (result.key_parts || [])
                  .map(
                    part =>
                      `<li>${escapeHtml(part)}</li>`
                  )
                  .join('')
              }

            </ul>

          </div>

        `;

      }



      /* IMPROVE */

      else if (action === 'improve') {

        outputEl.innerHTML = `

          <div class="card">

            <h3>Issues found</h3>

            <ul>

              ${
                (result.issues || [])
                  .map(
                    issue =>
                      `<li>${escapeHtml(issue)}</li>`
                  )
                  .join('')
              }

            </ul>

          </div>


          <div class="card">

            <h3>Suggestions</h3>

            <ul>

              ${
                (result.suggestions || [])
                  .map(
                    suggestion =>
                      `<li>${escapeHtml(suggestion)}</li>`
                  )
                  .join('')
              }

            </ul>

          </div>

        `;

      }



      /* OPTIMIZE */

      else if (action === 'optimize') {

        outputEl.innerHTML = `

          <div class="card">

            <h3>Optimized code</h3>

            <pre>${escapeHtml(
              result.optimized_code || ''
            )}</pre>

          </div>


          <div class="card">

            <h3>What changed</h3>

            <p>
              ${escapeHtml(
                result.what_changed || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>
              New time complexity
            </h3>

            <p>
              ${escapeHtml(
                result.new_time_complexity || ''
              )}
            </p>

          </div>


          <div class="card">

            <h3>
              New space complexity
            </h3>

            <p>
              ${escapeHtml(
                result.new_space_complexity || ''
              )}
            </p>

          </div>

        `;

      }

    }



    function escapeHtml(str) {

      const div =
        document.createElement('div');

      div.innerText =
        String(str ?? '');

      return div.innerHTML;

    }



    document
      .getElementById('btnExplain')
      .onclick =
        () => run('explain');


    document
      .getElementById('btnImprove')
      .onclick =
        () => run('improve');


    document
      .getElementById('btnOptimize')
      .onclick =
        () => run('optimize');

  </script>

</body>

</html>
